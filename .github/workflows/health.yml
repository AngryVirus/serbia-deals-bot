name: Deals independent watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */12 * * *'
permissions:
  contents: read
concurrency:
  group: serbia-deals-maintenance
  cancel-in-progress: false
jobs:
  health:
    if: vars.SERBIA_DEALS_MONITOR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix serverless
      - run: python3 -m collector.operations health
        env:
          TGCLOUD_TOKEN: ${{ secrets.SERBIA_DEALS_CLOUD_TOKEN }}
