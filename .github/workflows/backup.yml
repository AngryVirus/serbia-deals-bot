name: Deals encrypted user-data backup
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serbia-deals-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix serverless
      - name: Create encrypted snapshot and test offline recovery
        env:
          TGCLOUD_TOKEN: ${{ secrets.SERBIA_DEALS_CLOUD_TOKEN }}
        run: python3 serverless/backup.py create work/backup/users.sdcbk
      - name: Verify saved ciphertext and report before upload
        id: verified
        env:
          TGCLOUD_TOKEN: ${{ secrets.SERBIA_DEALS_CLOUD_TOKEN }}
        run: python3 serverless/backup.py verify-pair work/backup/users.sdcbk
      - name: Retain encrypted backup for seven days
        if: steps.verified.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official commit
        with:
          name: encrypted-users-${{ github.run_id }}
          path: |
            work/backup/users.sdcbk
            work/backup/users.report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
