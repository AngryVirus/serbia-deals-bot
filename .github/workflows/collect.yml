name: Refresh official prices
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the enabled schedule and source selection without import or messages
        type: boolean
        default: false
  schedule:
    - cron: '21 5 * * *'
permissions:
  contents: read
concurrency:
  group: serbia-deals-maintenance
  cancel-in-progress: false
jobs:
  collect:
    if: vars.SERBIA_DEALS_COLLECTION_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix serverless
      - name: Verify bounded source selection
        run: |
          python3 - <<'PYCODE'
          import json
          from collector.collect import ROOT,select_sources
          sources=select_sources(json.loads((ROOT/'collector/sources.json').read_text()),'enabled')
          print('Scheduled sources:', ', '.join(source['alias'] for source in sources))
          PYCODE
      - if: inputs.verify_only != true
        run: python3 -m collector.collect --publish --sources enabled --budget 2100
        env:
          TGCLOUD_TOKEN: ${{ secrets.SERBIA_DEALS_CLOUD_TOKEN }}
      - if: inputs.verify_only != true
        run: python3 -m collector.operations notify
        env:
          TGCLOUD_TOKEN: ${{ secrets.SERBIA_DEALS_CLOUD_TOKEN }}
